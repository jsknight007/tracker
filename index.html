<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Expense Tracker Master</title>
  <link rel="manifest" href="manifest.json">
  <script type="importmap"> { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai@latest" } } </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 1rem; background: #f0f2f5; color: #1c1e21; }
    .container { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); width: 100%; overflow: hidden; }
    h1 { margin-bottom: 1.5rem; color: #1a73e8; font-size: 1.4rem; text-align: center; font-weight: 800; letter-spacing: -0.5px; }
    
    /* SETTINGS BOX FOR AI KEY ONLY */
    .settings-toggle { background: #f1f5f9; border: none; color: #64748b; font-size: 0.75rem; padding: 6px 12px; border-radius: 8px; font-weight: 600; display: block; margin: 0 auto 1.5rem auto; cursor: pointer; }
    .config-section { background: #fff9c4; border: 1px solid #fbc02d; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: left; }
    .config-section input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px; font-size: 0.9rem; }
    .config-section button { width: 100%; padding: 0.75rem; background: #fbc02d; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 8px; }

    .manual-input-container { display: flex; gap: 0.5rem; width: 100%; align-items: center; margin-bottom: 1rem; }
    #manualInput { 
      flex: 1; min-width: 0; padding: 1.1rem; border: 2px solid #e4e6eb; border-radius: 14px; 
      font-size: 1.1rem; outline: none; transition: border-color 0.2s; background: #f9f9f9;
    }
    #manualInput:focus { border-color: #1a73e8; background: white; }
    
    .action-btn { 
      width: 54px; height: 54px; border: none; border-radius: 14px; cursor: pointer; 
      font-size: 1.4rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; 
    }
    #scanBtn { background: #e8f0fe; color: #1a73e8; border: 1px solid #d2e3fc; }
    #submitBtn { background: #1a73e8; color: white; }
    .action-btn:active { transform: scale(0.92); }

    .example-chips { text-align: center; margin-bottom: 1.5rem; }
    .example-chip { 
      padding: 0.6rem 0.9rem; background: #e8f0fe; border: 1px solid #d2e3fc; 
      border-radius: 12px; font-size: 0.85rem; color: #1967d2; cursor: pointer; 
      margin: 4px; display: inline-block; font-weight: 600;
    }
    .example-chip:active { background: #d2e3fc; transform: translateY(1px); }

    #status { margin-top: 1rem; padding: 0.8rem; border-radius: 10px; display: none; text-align: center; font-weight: 600; font-size: 0.9rem; }
    .success { background: #e6f4ea; color: #137333; display: block !important; }
    .error { background: #fce8e6; color: #c5221f; display: block !important; }
    .sending { background: #e8f0fe; color: #1967d2; display: block !important; }

    .btn-delete { width: 100%; margin: 1rem 0; padding: 0.9rem; background: #fff5f5; color: #c5221f; border: 1px solid #ffdada; border-radius: 14px; font-size: 0.9rem; cursor: pointer; font-weight: 600; }
    
    .history-card { margin-top: 2rem; border-top: 2px solid #f0f2f5; padding-top: 1.5rem; }
    .history-item { padding: 14px 0; border-bottom: 1px solid #f0f2f5; display: flex; justify-content: space-between; align-items: center; }
    .history-details { display: flex; flex-direction: column; gap: 2px; }
    .history-price { font-weight: 800; color: #1c1e21; font-size: 1rem; }
    
    select { flex: 1; padding: 0.8rem; border-radius: 12px; border: 2px solid #e4e6eb; background: white; font-size: 1rem; outline: none; }
    .view-btn { padding: 0.8rem 1.5rem; background: #1a73e8; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💳 Expense Tracker</h1>

    <button class="settings-toggle" onclick="document.getElementById('configPanel').toggleAttribute('hidden')">⚙️ GEMINI SETUP</button>

    <div class="config-section" id="configPanel" hidden>
      <label style="font-size:0.75rem; font-weight:bold; color:#555;">Gemini API Key</label>
      <input type="password" id="keyInput" placeholder="AI Key for Scanning">
      <button onclick="saveAIKey()">Save API Key</button>
    </div>

    <div class="manual-input-container">
      <button id="scanBtn" class="action-btn" onclick="document.getElementById('fileIn').click()">📷</button>
      <input type="file" id="fileIn" accept="image/*" capture="environment" style="display:none">
      
      <input type="text" id="manualInput" placeholder="Store Price Card Date" spellcheck="false" autocomplete="off">
      <button id="submitBtn" class="action-btn">📤</button>
    </div>

    <div class="example-chips">
      <div class="example-chip" onclick="fill('Citi')">Citi</div>
      <div class="example-chip" onclick="fill('Discover')">Discover</div>
      <div class="example-chip" onclick="fill('GreenState')">GreenState</div>
      <div class="example-chip" onclick="fill('Costco')">Costco</div>
      <div class="example-chip" onclick="fill('Yesterday')">Yesterday</div>
    </div>

    <div id="status"></div>

    <button onclick="deleteLast()" class="btn-delete">Undo Last Entry</button>

    <div class="history-card">
      <h3 style="font-size: 1rem; margin-bottom: 1rem; color: #65676b;">Reconcile Records</h3>
      <div style="display: flex; gap: 10px; margin-bottom: 1.25rem;">
        <select id="cardFilter">
          <option value="Citi">Citi</option>
          <option value="GreenState">GreenState</option>
          <option value="Discover">Discover</option>
          <option value="Costco">Costco</option>
          <option value="Verizon">Verizon</option>
          <option value="Other">Other</option>
        </select>
        <button onclick="fetchHistory()" class="view-btn">View</button>
      </div>
      <div id="historyList"></div>
    </div>
    
    <div style="text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #bdc3c7; font-weight: 600;">V2.0.0 • HYBRID COGNITION ENGINE</div>
  </div>

  <script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // 1. HARDCODE YOUR SCRIPT URL HERE
    const CONFIG = { WEB_APP_URL: "https://script.google.com/macros/s/AKfycbxy2OhLXzjmz1JJLU6RgCzKUP78WL4jJ29tQNX6l3AhgIousJKZ7WwbAvXrpiZkHOKc/exec" };
    
    const elements = {
      manualInput: document.getElementById("manualInput"),
      submitBtn: document.getElementById("submitBtn"),
      status: document.getElementById("status"),
      historyList: document.getElementById("historyList"),
      fileIn: document.getElementById("fileIn"),
      keyInput: document.getElementById("keyInput")
    };

    // Load Saved Gemini Key if available
    elements.keyInput.value = localStorage.getItem('gemini_key') || '';

    window.saveAIKey = () => {
      localStorage.setItem('gemini_key', elements.keyInput.value.trim());
      showStatus("✅ API Key Saved", "success");
      setTimeout(() => document.getElementById('configPanel').setAttribute('hidden', ''), 1000);
    };

    window.fill = (val) => { 
      elements.manualInput.value += (elements.manualInput.value ? " " : "") + val; 
      elements.manualInput.focus(); 
    }

    function showStatus(msg, type) {
      elements.status.textContent = msg;
      elements.status.className = type;
      if (type !== 'sending') setTimeout(() => elements.status.className = '', 4000);
    }

// 2. RECEIPT CAMERA SCANNER LOGIC (Updated to focus only on Store, Price, and Date)
    elements.fileIn.onchange = async (e) => {
      const file = e.target.files[0]; 
      if (!file) return;
      
      const apiKey = localStorage.getItem('gemini_key');
      if (!apiKey) {
        showStatus("⚠️ Please configure your Gemini API Key first!", "error");
        document.getElementById('configPanel').removeAttribute('hidden');
        return;
      }

      showStatus("⏳ Gemini is scanning receipt...", "sending");
      
      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          const genAI = new GoogleGenerativeAI(apiKey);
          const model = genAI.getGenerativeModel({ model: "gemini-3.5-flash" });
          
          // Tightened prompt focusing ONLY on Store, Amount, and Date
          const prompt = "Analyze this receipt image. Extract the store name, the absolute final grand total parameter, and the transaction date. Output ONLY a clean single-line conversational string formatted strictly like this template: [StoreName] $[Amount] [Month Day] (Example output string: 'Target $42.50 May 12th'). Do not attempt to guess or extract the payment method or credit card name. Do not include markdown code blocks or formatting.";
          
          const result = await model.generateContent([prompt, { inlineData: { data: reader.result.split(',')[1], mimeType: "image/jpeg" } }]);
          const parsedCommand = result.response.text().trim().replace(/`/g, "");

          if (parsedCommand) {
            elements.manualInput.value = parsedCommand;
            showStatus("✨ Scan Loaded! Tap a card chip if needed, then send.", "success");
          } else {
            showStatus("❌ Couldn't parse receipt text clearly.", "error");
          }
        } catch (err) { 
          showStatus("❌ Scanning error: " + err.message, "error"); 
        }
      };
      reader.readAsDataURL(file);
    };
    
    async function submitExpense(command) {
      if (!command) return;
      showStatus("Sending to Sheet...", "sending");
      try {
        await fetch(CONFIG.WEB_APP_URL, {
          method: "POST", mode: "no-cors",
          body: new URLSearchParams({ 'command': command })
        });
        showStatus("✅ Saved successfully", "success");
        elements.manualInput.value = "";
      } catch (err) { showStatus("❌ Error connecting", "error"); }
    }

    elements.manualInput.addEventListener("keypress", (e) => { if (e.key === "Enter") elements.submitBtn.click(); });
    elements.submitBtn.onclick = () => { submitExpense(elements.manualInput.value.trim()); };

    window.deleteLast = async () => {
      if (confirm("Delete the most recent entry?")) {
        showStatus("Deleting...", "sending");
        await fetch(`${CONFIG.WEB_APP_URL}?action=deleteLast`);
        showStatus("🗑️ Entry deleted", "success");
        if (elements.historyList.innerHTML !== "") window.fetchHistory();
      }
    }

    window.fetchHistory = async () => {
      const card = document.getElementById('cardFilter').value;
      elements.historyList.innerHTML = "<p style='padding:10px; font-size:0.9rem; color:#65676b;'>Searching...</p>";
      try {
        const res = await fetch(`${CONFIG.WEB_APP_URL}?card=${card}`);
        const data = await res.json();
        if (data.entries && data.entries.length > 0) {
          elements.historyList.innerHTML = data.entries.map(e => `
            <div class="history-item">
              <div class="history-details">
                <span style="font-weight:700; font-size:0.95rem;">${e.where}</span>
                <span style="font-size:0.75rem; color:#8a8d91;">${e.when}</span>
              </div>
              <div style="display:flex; align-items:center; gap:12px;">
                <span class="history-price">$${parseFloat(e.price).toFixed(2)}</span>
                <button onclick="reconcileItem(${e.index})" style="background:#e7f3ff; color:#1a73e8; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:1rem;">✓</button>
              </div>
            </div>
          `).join('');
        } else { elements.historyList.innerHTML = "<p style='padding:10px; color:#65676b;'>No items found.</p>"; }
      } catch (e) { elements.historyList.innerHTML = "<p style='padding:10px; color:#c5221f;'>Fetch failed.</p>"; }
    }

    window.reconcileItem = async (index) => {
      if (confirm("Remove this item?")) {
        await fetch(`${CONFIG.WEB_APP_URL}?action=deleteSpecific&index=${index}`);
        window.fetchHistory();
      }
    }
  </script>
</body>
</html>
